<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصيرفي — الكاش فلو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--navy:#0d1b6b;--navy2:#0a145a;--bg:#f3f5fa;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#e5e8f0;
--blue:#2d6cdf;--green:#1e9e57;--red:#d64545;--amber:#e08a1e;--teal:#1aa3b8}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0a0f6b 0%,#0d1b8a 55%,#0f6b3a 100%);display:flex;align-items:center;justify-content:center;z-index:10}
.lc{background:#fff;border-radius:22px;padding:42px 46px;width:min(440px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:34px;font-weight:800;color:#1e9e57;letter-spacing:-1px}.logo span{color:var(--navy)}
.lc h1{margin:14px 0 2px;color:var(--navy);font-size:24px}.lc p{margin:0 0 26px;color:var(--mute)}
.lc select,.lc button{width:100%;padding:13px;border-radius:12px;font-family:inherit;font-size:16px}
.lc select{border:2px solid var(--navy);text-align:center;margin-bottom:12px}.lc button{background:var(--navy);color:#fff;border:0;font-weight:700;cursor:pointer}
/* layout */
.app{display:none;min-height:100vh}.side{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--navy);color:#cfd6ff;padding:18px 0}
.brand{display:flex;gap:10px;align-items:center;padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand b{color:#fff;font-size:17px}.brand small{display:block;color:#9aa6e6}
.navh{font-size:11px;letter-spacing:1px;color:#7f8bd0;margin:18px 22px 6px}
.nav a{display:flex;gap:10px;padding:10px 22px;color:#dfe4ff;text-decoration:none;cursor:pointer;border-right:4px solid transparent}
.nav a.on{background:rgba(255,255,255,.1);border-right-color:#3ddc84;color:#fff;font-weight:700}
.user{position:absolute;bottom:14px;right:18px;left:18px;display:flex;gap:10px;align-items:center;color:#fff}
.user i{width:32px;height:32px;border-radius:50%;background:#2d3a9a;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
.main{margin-right:250px;padding:18px 24px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.top h2{margin:0;font-size:22px}.top small{color:var(--mute)}.upd{border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mute);font-size:12px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:14px;padding:16px 18px;border:1px solid var(--line);border-bottom:4px solid var(--blue)}
.kpi h4{margin:0;font-size:11.5px;letter-spacing:.5px;color:var(--mute);font-weight:700}.kpi .v{font-size:27px;font-weight:800;margin-top:4px;direction:ltr;text-align:right}
.kpi small{color:var(--mute)}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}.g2e{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.alert{border-radius:14px;padding:16px 18px;margin-bottom:14px;border:2px solid}.alert.red{border-color:var(--red);background:#fdeeee}.alert.green{border-color:var(--green);background:#eaf7ef}
.alert b{font-size:19px}.alert.red b{color:var(--red)}.alert.green b{color:var(--green)}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mute);font-size:12px;font-weight:700}
td.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.neg{color:var(--red)}.pos{color:var(--green)}
.pill{padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700}.p1{background:#e7f6ee;color:var(--green)}.p2{background:#fff3e0;color:var(--amber)}.p3{background:#e8efff;color:var(--blue)}
.bar{height:6px;background:#9fb4ea;border-radius:4px;margin-top:3px}
.sec{display:none}.sec.on{display:block}.chart{position:relative;height:300px}
@media(max-width:900px){.side{position:static;width:auto}.main{margin:0;padding:14px}.g2,.g2e{grid-template-columns:1fr}.user{position:static;margin-top:10px}}
</style>
</head>
<body>
<div id="login"><div class="lc"><div class="logo">الصيرفي<span>.</span></div><h1>Al-Serafy Pharmacies</h1><p>Cash Flow Dashboard</p>
<select id="who"></select><input id="pw" type="password" placeholder="كلمة السر" onkeydown="if(event.key==='Enter')enter()"
 style="width:100%;padding:13px;border-radius:12px;border:2px solid #d5dae8;font-family:inherit;font-size:16px;text-align:center;margin-bottom:12px">
<button onclick="enter()" id="go">دخول</button><div id="err" style="color:#d64545;margin-top:10px;min-height:20px"></div></div></div>
<div class="app" id="app">
 <aside class="side"><div class="brand"><div class="logo" style="font-size:22px">ص</div><div><b>Al-Serafy</b><small>الكاش فلو</small></div></div>
  <div class="navh">الكاش فلو</div><div class="nav">
   <a data-s="ov" class="on">📊 نظرة عامة</a><a data-s="cm">📅 الشهر الحالي</a><a data-s="yr">🗓 الشهور</a></div>
  <div class="navh">الموردين</div><div class="nav"><a data-s="sp">🏭 أرصدة الموردين</a><a data-s="ch">🧾 الشيكات الجاية</a></div>
  <div class="navh">الشركاء</div><div class="nav"><a data-s="pt">👥 كاش فلو الشركاء</a></div>
  <div class="user"><i id="ini">R</i><span id="uname"></span></div></aside>
 <main class="main">
  <div class="top"><div><h2 id="title">نظرة عامة</h2><small id="sub"></small></div><div class="upd" id="upd"></div></div>
  <section class="sec on" id="ov"></section><section class="sec" id="cm"></section><section class="sec" id="yr"></section>
  <section class="sec" id="sp"></section><section class="sec" id="ch"></section><section class="sec" id="pt"></section>
 </main>
</div>
<script src="data.js"></script>
<script>
let D={};const USERS=["Ramy Radwan","Dr. Mohamed El-Serafy","Dr. Ahmed El-Serafy","Dr. Amr El-Serafy","Dr. Nader","Eng. Karim","Abdelrahman Mohamed","Ahmed Abdelrahim","Administrator"];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const E=window.CFE,enc=new TextEncoder(),sub=crypto.subtle;
 const base=await sub.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
 const km=new Uint8Array(await sub.deriveBits({name:"PBKDF2",salt:b64(E.s),iterations:E.i,hash:"SHA-256"},base,512));
 const hk=k=>sub.importKey("raw",k,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
 const ek=await hk(km.slice(0,32)),mk=await hk(km.slice(32)),n=b64(E.n),c=b64(E.c);
 const mac=new Uint8Array(n.length+c.length);mac.set(n);mac.set(c,n.length);
 const tag=new Uint8Array(await sub.sign("HMAC",mk,mac)),t=b64(E.t);
 if(tag.length!==t.length||tag.some((x,i)=>x!==t[i]))throw new Error("bad");
 const blocks=Math.ceil(c.length/32),ks=await Promise.all(Array.from({length:blocks},(_,i)=>{const b=new Uint8Array(n.length+4);b.set(n);new DataView(b.buffer).setUint32(n.length,i);return sub.sign("HMAC",ek,b)}));
 const out=new Uint8Array(c.length);for(let i=0;i<c.length;i++)out[i]=c[i]^new Uint8Array(ks[i>>5])[i&31];
 return JSON.parse(new TextDecoder().decode(out))}const f=v=>v==null?"—":(v<0?"-":"")+Math.round(Math.abs(v)).toLocaleString("en-US");
const fm=v=>(v/1e6).toFixed(1)+"M";const cls=v=>v<0?"neg":"pos";const dd=s=>s.slice(8,10)+"/"+s.slice(5,7);
const who=document.getElementById("who");who.innerHTML=`<option value="">— اختار اسمك —</option>`+USERS.map(u=>`<option>${u}</option>`).join("");
try{const s=localStorage.getItem("cfu");if(s)who.value=s}catch(e){}
async function enter(){const er=document.getElementById("err");if(!who.value){er.textContent="اختار اسمك";return}
 er.textContent="جاري الفتح...";try{D=await decrypt(document.getElementById("pw").value)}catch(e){er.textContent="كلمة السر غلط";return}
 er.textContent="";try{localStorage.setItem("cfu",who.value)}catch(e){}
 document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";
 document.getElementById("uname").textContent=who.value;document.getElementById("ini").textContent=who.value.replace(/^(Dr\.|Eng\.)\s*/,"")[0];render()}
document.querySelectorAll(".nav a").forEach(a=>a.onclick=()=>{document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("on"));a.classList.add("on");
 document.querySelectorAll(".sec").forEach(x=>x.classList.remove("on"));document.getElementById(a.dataset.s).classList.add("on");
 document.getElementById("title").textContent=a.textContent.replace(/^\S+\s/,"")});
const charts={};function chart(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg)}
Chart.defaults.font.family="Cairo";Chart.defaults.color="#6b7690";
function kpi(t,v,s,c){return `<div class="kpi" style="border-bottom-color:${c||"var(--blue)"}"><h4>${t}</h4><div class="v ${typeof v==="number"?cls(v):""}">${typeof v==="number"?fm(v):v}</div><small>${s||""}</small></div>`}
function render(){
 const C=D.current||{},act=C.actual||[],fc=C.forecast||[],pl=C.plan||[];
 document.getElementById("upd").textContent="آخر تحديث: "+(D.generated||"");document.getElementById("sub").textContent=(C.month||"")+(C.cut?" • تحديث "+dd(C.cut):"");
 const endF=fc.length?fc[fc.length-1].close:(act.length?act[act.length-1].close:0),endP=pl.length?pl[pl.length-1].close:0;
 const recM=[...act,...fc].reduce((a,x)=>a+x.rec,0),supM=[...act,...fc].reduce((a,x)=>a+x.sup,0);
 const al=D.alert;
 // overview
 document.getElementById("ov").innerHTML=`
 <div class="kpis">${kpi("رصيد آخر الشهر المتوقع",endF,"الخطة: "+f(endP),endF<0?"var(--red)":"var(--green)")}
 ${kpi("مقبوضات الشهر (فعلي + متوقع)",recM,C.month||"","var(--teal)")}${kpi("موردين الشهر (فعلي + متوقع)",supM,"","var(--amber)")}
 ${kpi("شيكات الـ30 يوم الجايين",D.cheques.total30,(D.cheques.count30||0)+" شيك","var(--navy)")}
 ${kpi("أرصدة الموردين",D.suppliers.gross,"منها شيكات "+fm(D.suppliers.cheques),"var(--red)")}</div>
 ${al?`<div class="alert ${al.level}">⚠️ <b>${al.title}</b><div>${al.text}</div></div>`:""}
 <div class="g2"><div class="card"><h3>الرصيد يوم بيوم – ${C.month||""}</h3><div class="chart"><canvas id="c1"></canvas></div></div>
 <div class="card"><h3>المقبوضات والمدفوعات كل شهر</h3><div class="chart"><canvas id="c2"></canvas></div></div></div>`;
 const labs=pl.map(x=>dd(x.d)),am={},fmm={};act.forEach(x=>am[x.d]=x.close);fc.forEach(x=>fmm[x.d]=x.close);
 chart("c1",{type:"line",data:{labels:labs,datasets:[{label:"الخطة",data:pl.map(x=>x.close),borderColor:"#b8c1d9",borderDash:[4,4],pointRadius:0},
  {label:"فعلي",data:pl.map(x=>am[x.d]??null),borderColor:"#1e9e57",backgroundColor:"#1e9e57",tension:.25},
  {label:"متوقع",data:pl.map(x=>fmm[x.d]??null),borderColor:"#2d6cdf",borderDash:[6,3],tension:.25}]},
  options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>fm(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+": "+f(c.raw)}}}}});
 const M=D.months||[];
 chart("c2",{data:{labels:M.map(m=>m.label.split(" ")[0]),datasets:[{type:"bar",label:"مقبوضات",data:M.map(m=>m.receipts),backgroundColor:"#7d93d6"},
  {type:"bar",label:"مدفوعات",data:M.map(m=>m.payments),backgroundColor:"#7fd1a0"},{type:"line",label:"الرصيد النهائي",data:M.map(m=>m.closing),borderColor:"#d64545",yAxisID:"y"}]},
  options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>fm(v)}}}}});
 // current month
 const cmp=C.compare||[];
 document.getElementById("cm").innerHTML=`<div class="kpis">${kpi("رصيد آخر الفعلي",act.length?act[act.length-1].close:0,act.length?"لحد "+dd(act[act.length-1].d):"")}
 ${kpi("رصيد بداية المتوقع",fc.length?fc[0].close-fc[0].rec+fc[0].sup+fc[0].oth:0,C.balance_entered!=null?"رصيد الخزنة + البنك الفعلي":"محسوب","var(--teal)")}
 ${kpi("رصيد آخر الشهر المتوقع",endF,"","var(--green)")}${kpi("الفرق عن الخطة",endF-endP,"","var(--amber)")}</div>
 <div class="g2e"><div class="card"><h3>الفعلي (لحد يوم التحديث)</h3>${dayTable(act)}</div><div class="card"><h3>المتوقع لباقي الشهر</h3>${dayTable(fc)}</div></div>
 <div class="card"><h3>الموردين: المخطط قصاد اللي اتصرف</h3><table><tr><th>المورد</th><th>مخطط</th><th>اتصرف</th><th>الفرق</th><th>الحالة</th></tr>
 ${cmp.map(r=>{const df=r.plan-r.paid;const st=Math.abs(df)<1?'<span class="pill p1">تمام</span>':(df>0?'<span class="pill p2">اتنقل للمتوقع</span>':'<span class="pill p3">اتصرف زيادة</span>');
  return `<tr><td>${r.name}</td><td class="n">${f(r.plan)}</td><td class="n">${f(r.paid)}</td><td class="n ${cls(-df)}">${f(df)}</td><td>${st}</td></tr>`}).join("")}</table></div>`;
 // months
 document.getElementById("yr").innerHTML=`<div class="card"><h3>الشهور</h3><table><tr><th>الشهر</th><th>الحالة</th><th>افتتاحي</th><th>مقبوضات</th><th>مدفوعات</th><th>منها موردين</th><th>نهائي</th></tr>
 ${M.map(m=>`<tr><td>${m.label}</td><td><span class="pill ${m.status=="فعلي"?"p1":m.status=="خطة"?"p3":"p2"}">${m.status}</span></td><td class="n ${cls(m.opening)}">${f(m.opening)}</td><td class="n">${f(m.receipts)}</td><td class="n">${f(m.payments)}</td><td class="n">${f(m.suppliers)}</td><td class="n ${cls(m.closing)}">${f(m.closing)}</td></tr>`).join("")}</table></div>`;
 // suppliers
 const S=D.suppliers,top=S.top||[],mx=top.length?top[0].gross:1;
 document.getElementById("sp").innerHTML=`<div class="kpis">${kpi("إجمالي أرصدة الموردين",S.gross,(S.count||"")+" مورد – "+S.date,"var(--red)")}${kpi("منها شيكات مكتوبة",S.cheques,"","var(--navy)")}${kpi("صافي من غير شيكات",S.net,"لسه هيتوزع","var(--amber)")}</div>
 <div class="card"><h3>أكبر الموردين بالرصيد</h3><table><tr><th>#</th><th>المورد</th><th>الرصيد</th><th>منه شيكات</th><th>صافي</th></tr>
 ${top.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}<div class="bar" style="width:${(r.gross/mx*100).toFixed(0)}%"></div></td><td class="n">${f(r.gross)}</td><td class="n">${f(r.cheques)}</td><td class="n">${f(r.net)}</td></tr>`).join("")}</table></div>`;
 // cheques
 const CQ=D.cheques;
 document.getElementById("ch").innerHTML=`<div class="kpis">${kpi("شيكات 30 يوم",CQ.total30,(CQ.count30||0)+" شيك","var(--navy)")}${kpi("شيكات 60 يوم",CQ.total60,"","var(--blue)")}</div>
 <div class="g2"><div class="card"><h3>الشيكات المستحقة يوم بيوم (60 يوم)</h3><div class="chart"><canvas id="c3"></canvas></div></div>
 <div class="card"><h3>أكبر الموردين في الشيكات (30 يوم)</h3><table><tr><th>المورد</th><th>المبلغ</th></tr>${(CQ.by_supplier||[]).map(r=>`<tr><td>${r.name}</td><td class="n">${f(r.amount)}</td></tr>`).join("")}</table></div></div>`;
 chart("c3",{type:"bar",data:{labels:(CQ.days||[]).map(x=>dd(x.d)),datasets:[{label:"شيكات",data:(CQ.days||[]).map(x=>x.amount),backgroundColor:"#2d6cdf"}]},
  options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fm(v)}}}}});
 // partners
 const P=D.partners;
 if(P&&P.balance){const cols={"المجموعة":"#14213d","محمد":"#2d6cdf","أحمد":"#1e9e57","عمرو":"#e08a1e"};
  document.getElementById("pt").innerHTML=`${P.warning?`<div class="alert red">${P.warning}</div>`:""}<div class="card"><h3>فاضل يشتري لحد السقف – أول 6 شهور</h3><small style="color:var(--mute)">ده المتاح لكل شريك للمشتريات الجديدة (على كوده أو من الإدارة) بعد نصيبه من الشيكات والأرصدة القديمة</small><div class="chart"><canvas id="c4"></canvas></div></div>
  <div class="card"><h3>فاضل يشتري لحد السقف</h3><table><tr><th></th>${P.months.map(m=>`<th>${m.split(" ")[0]}</th>`).join("")}</tr>
  ${Object.entries(P.room||{}).map(([k,v])=>`<tr><td><b>${k}</b></td>${v.map(x=>`<td class="n ${cls(x)}">${fm(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  chart("c4",{type:"bar",data:{labels:P.months.slice(0,6),datasets:Object.entries(P.room||{}).filter(([k])=>k!="المجموعة").map(([k,v])=>({label:k,data:v.slice(0,6),backgroundColor:cols[k]||"#888"}))},
   options:{maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>fm(v)}}}}});
 } else document.getElementById("pt").innerHTML=`<div class="card">مفيش بيانات شركاء لسه.</div>`;
}
function dayTable(a){if(!a.length)return "<p>مفيش أيام</p>";return `<div style="max-height:360px;overflow:auto"><table><tr><th>اليوم</th><th>مقبوضات</th><th>موردين</th><th>مصروفات</th><th>الرصيد</th></tr>
 ${a.map(x=>`<tr><td>${dd(x.d)}</td><td class="n">${f(x.rec)}</td><td class="n">${f(x.sup)}</td><td class="n">${f(x.oth)}</td><td class="n ${cls(x.close)}">${f(x.close)}</td></tr>`).join("")}</table></div>`}
</script>
</body></html>
